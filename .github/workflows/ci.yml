name: CI

on:
  push:
    branches:
      - main
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libraqm and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm-dev libfreetype6-dev libfribidi-dev libharfbuzz-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint and format check
        run: |
          uvx ruff check
          uvx ruff format --check

      - name: Run test suite
        run: |
          uv run test.py
